name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Integration tests create throwaway databases on this server.
      DATABASE_URL: postgres://keyloop:keyloop@localhost:5432/keyloop?sslmode=disable
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: keyloop
          POSTGRES_PASSWORD: keyloop
          POSTGRES_DB: keyloop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keyloop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Install golangci-lint
        run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: make check

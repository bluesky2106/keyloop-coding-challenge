server {
    listen 8080;
    root /usr/share/nginx/html;

    # The app only talks to its own origin, loads nothing from elsewhere, and is never framed.
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Docker's embedded DNS. The upstream is resolved per request, not at startup, so this
    # container starts even when the API is not running yet (it answers 502 until it is).
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built assets have content hashes in their names, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # API reference (Swagger UI). It is served from the same origin as the API, so "Try it out"
    # needs no CORS. Swagger UI's stylesheet embeds data: images, so this path alone may load
    # them; everything else stays 'self'. The headers are repeated because add_header in a
    # location replaces the server-level ones. A missing file is a 404, not the app.
    # The redirect is relative: nginx would otherwise build it from its own port (8080), which
    # is wrong whenever the container is published on another one (WEB_PORT).
    location = /docs {
        absolute_redirect off;
        return 301 /docs/;
    }

    location /docs/ {
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/index.html =404;
        expires -1;
    }

    # Any other path is a client-side route: serve the app and let it decide. index.html
    # itself must always be revalidated so a new release is picked up.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
